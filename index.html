const $=id=>document.getElementById(id);let order=[],pos=0,tries=0,locked=false,assisted=false,results=[];
function normalize(s){return s.normalize('NFC').trim().toLocaleLowerCase('fr').replace(/\s+/g,' ')}
function isCorrect(s,item){s=normalize(s);return s===item.word||s===item.article+' '+item.word}
function show(){tries=0;locked=false;assisted=false;$('play').hidden=false;$('end').hidden=true;const n=order[pos],w=words[n];$('counter').textContent=`Image ${pos+1} sur ${order.length}`;$('article').textContent=w.article;$('picture').style.backgroundPosition=`${(n%4)*100/3}% ${n<4?0:100}%`;$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('hint').disabled=false;$('next').hidden=true;$('feedback').textContent='';$('feedback').className='feedback';$('dots').replaceChildren();order.forEach((_,i)=>{let d=document.createElement('span');d.className='dot'+(i<pos?' done':i===pos?' current':'');$('dots').append(d)});document.querySelectorAll('[data-letter]').forEach(b=>b.disabled=false)}
